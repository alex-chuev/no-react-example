<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 100 100%27%3E%3Ctext y=%27.9em%27 font-size=%2790%27%3E%F0%9F%A7%A9%3C/text%3E%3C/svg%3E">
  <title>NoReact examples</title>
  <link rel="stylesheet" href="./shared/style.css">
  <style>
    .gallery { display: grid; grid-template-columns: repeat(auto-fill, minmax(14rem, 1fr)); gap: 1rem; padding: 0; list-style: none; }
    .gallery a { display: block; height: 100%; color: inherit; text-decoration: none; }
    .gallery a:hover { border-color: var(--accent); }
    .gallery h2 { margin: 0 0 .25rem; font-size: 1rem; }
    .gallery p { margin: 0; color: var(--muted); font-size: .9rem; }
    .gallery .number { color: var(--accent); font-variant-numeric: tabular-nums; }
  </style>
</head>
<body>
  <header class="page-header">
    <strong>NoReact examples</strong>
    <a href="https://github.com/alex-chuev/no-react">NoReact on GitHub</a>
  </header>
  <main id="app"></main>
  <script type="module" src="./gallery.tsx"></script>
</body>
</html>
